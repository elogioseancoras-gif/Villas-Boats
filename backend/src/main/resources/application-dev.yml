spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:villas_boats}?stringtype=unspecified
    username: ${DB_USER:villasboats}
    password: ${DB_PASSWORD:dev_password_change_in_production}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: true
    properties:
      hibernate:
        generate_statistics: false

jwt:
  secret: ${JWT_SECRET:dGhpc19pc19hX3NlY3VyZV9kZXZlbG9wbWVudF9zZWNyZXRfa2V5X2NoYW5nZV9pbl9wcm9kdWN0aW9uX3RoaXNfbXVzdF9iZV9hdF9sZWFzdF8yNTZfYml0c19mb3JfaHMyNTY=}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.villasboats: DEBUG
    org.springframework.security: DEBUG
