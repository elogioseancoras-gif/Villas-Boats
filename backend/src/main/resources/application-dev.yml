spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:villas_boats}
    username: ${DB_USER:villasboats}
    password: ${DB_PASSWORD:dev_password_change_in_production}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: true
    properties:
      hibernate:
        generate_statistics: false

logging:
  level:
    com.villasboats: DEBUG
    org.springframework.security: DEBUG
