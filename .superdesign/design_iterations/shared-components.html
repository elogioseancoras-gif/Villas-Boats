<!-- ========================================
     JAVASCRIPT FOR COMPONENT LOADING
     ======================================== -->
<script>
    /**
     * Load shared components (navbar and footer) into placeholders
     */
    function loadSharedComponents() {
        // Load Navbar
        const navbarTemplate = document.getElementById('navbar-template');
        const navbarPlaceholder = document.getElementById('navbar-placeholder');
        if (navbarTemplate && navbarPlaceholder) {
            const navbarClone = navbarTemplate.content.cloneNode(true);
            navbarPlaceholder.appendChild(navbarClone);
        }

        // Load Footer
        const footerTemplate = document.getElementById('footer-template');
        const footerPlaceholder = document.getElementById('footer-placeholder');
        if (footerTemplate && footerPlaceholder) {
            const footerClone = footerTemplate.content.cloneNode(true);
            footerPlaceholder.appendChild(footerClone);
        }

        // Re-initialize Lucide icons after components are loaded
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }

        // Add footer link hover styles
        addFooterLinkStyles();
    }

    /**
     * Add hover styles to footer links
     */
    function addFooterLinkStyles() {
        const footerLinks = document.querySelectorAll('.footer-link');
        footerLinks.forEach(link => {
            link.addEventListener('mouseenter', function() {
                this.style.color = 'white';
            });
            link.addEventListener('mouseleave', function() {
                this.style.color = 'rgba(255, 255, 255, 0.8)';
            });
        });
    }

    /**
     * Toggle language dropdown menu
     */
    function toggleLanguageMenu(event) {
        event.stopPropagation();
        const menu = event.currentTarget.nextElementSibling;
        menu.classList.toggle('hidden');

        // Close menu when clicking outside
        document.addEventListener('click', function closeMenu(e) {
            if (!menu.contains(e.target) && !event.currentTarget.contains(e.target)) {
                menu.classList.add('hidden');
                document.removeEventListener('click', closeMenu);
            }
        });
    }

    /**
     * Select language and update UI
     */
    function selectLanguage(event, langCode, langDisplay) {
        event.preventDefault();
        document.getElementById('current-language').textContent = langCode;
        document.querySelector('.language-menu').classList.add('hidden');

        // Store language preference
        localStorage.setItem('preferred-language', langCode);

        // TODO: Implement actual language switching logic
        console.log('Language changed to:', langCode);
    }

    /**
     * Toggle mobile menu (placeholder for future implementation)
     */
    function toggleMobileMenu() {
        // TODO: Implement mobile menu functionality
        console.log('Mobile menu toggled');
    }

    // Auto-load components when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadSharedComponents);
    } else {
        loadSharedComponents();
    }
</script>

</style>
