# Docker Compose configuration for LOCAL DEVELOPMENT
# This file is designed for testing locally before deploying to Portainer
#
# Usage:
#   docker compose -f docker-compose.local.yml up
#
# Access points:
#   Frontend: http://localhost:3000
#   Backend API: http://localhost:8080
#   Postgres: localhost:5432
#   Redis: localhost:6379

name: villas-boats-local

volumes:
  postgres_data_local:
  redis_data_local:
  uploads_data_local:

networks:
  default:
    driver: bridge

services:
  postgres:
    image: postgres:18-alpine
    container_name: villas-boats-postgres-local
    env_file: .env.staging
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: villas-boats-redis-local
    env_file: .env.staging
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_local:/data
    ports:
      - "6379:6379"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_REPO:-elogioseancoras-gif/villas-boats}/backend:${VERSION:-develop}
    container_name: villas-boats-backend-local
    env_file: .env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      N8N_WEBHOOK_BASE_URL: https://n8n.mcg.sh/webhook
      N8N_WEBHOOK_ENABLED: "true"
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      UPLOAD_DIR: /app/uploads
      VERSION: ${VERSION:-1.0.0-local}
    volumes:
      - uploads_data_local:/app/uploads
    ports:
      - "8080:8080"
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_REPO:-elogioseancoras-gif/villas-boats}/frontend:${VERSION:-develop}
    container_name: villas-boats-frontend-local
    env_file: .env.staging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # NEXT_PUBLIC_API_URL is baked into the image at build time via build-arg
      # For local development, the image should be built with NEXT_PUBLIC_API_URL=http://localhost:8080/api
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
