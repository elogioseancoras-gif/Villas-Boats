name: villas-boats-staging

volumes:
  postgres_data:
    name: villas-boats-postgres-staging
  redis_data:
    name: villas-boats-redis-staging
  uploads_data:
    name: villas-boats-uploads-staging

networks:
  default:
  mcg.sh_network:
    external: true

services:
  postgres:
    image: postgres:18-alpine
    container_name: villas-boats-postgres-staging
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: villas-boats-redis-staging
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_REPO:-villasboats}/backend:${VERSION:-latest}
    container_name: villas-boats-backend-staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: https://villasboats.mcg.sh
      N8N_WEBHOOK_BASE_URL: https://n8n.mcg.sh/webhook
      N8N_WEBHOOK_ENABLED: "true"
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      UPLOAD_DIR: /app/uploads
      VERSION: ${VERSION:-1.0.0}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_REPO:-villasboats}/frontend:${VERSION:-latest}
    container_name: villas-boats-frontend-staging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # NEXT_PUBLIC_API_URL is baked into the image at build time via build-arg
      # Runtime environment variables don't work for NEXT_PUBLIC_* in Next.js standalone
      NODE_ENV: production
    networks:
      - default
      - mcg.sh_network
    labels:
      # Enable Traefik
      - "traefik.enable=true"

      # HTTP Router
      - "traefik.http.routers.villasboats-staging.rule=Host(`villasboats.mcg.sh`)"
      - "traefik.http.routers.villasboats-staging.entrypoints=websecure"
      - "traefik.http.routers.villasboats-staging.tls=true"
      - "traefik.http.routers.villasboats-staging.tls.certresolver=letsencrypt"

      # Service
      - "traefik.http.services.villasboats-staging.loadbalancer.server.port=3000"

      # Middleware - Security headers with strengthened CSP
      - "traefik.http.middlewares.villasboats-staging-headers.headers.customResponseHeaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.middlewares.villasboats-staging-headers.headers.customResponseHeaders.X-Content-Type-Options=nosniff"
      # Removed 'unsafe-inline' and 'unsafe-eval' from script-src to strengthen XSS protection
      # If Next.js runtime requires these, consider implementing nonce-based CSP instead
      - "traefik.http.middlewares.villasboats-staging-headers.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://villasboats.mcg.sh"
      - "traefik.http.routers.villasboats-staging.middlewares=villasboats-staging-headers"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
