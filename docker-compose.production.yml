# Docker Compose configuration for PRODUCTION
# This file is designed for production deployment via Portainer
#
# Environment Variables Required (set in Portainer UI):
#   DB_NAME, DB_USER, DB_PASSWORD
#   REDIS_PASSWORD
#   JWT_SECRET_KEY
#   DOCKER_REGISTRY (default: ghcr.io)
#   DOCKER_REPO (e.g., elogioseancoras-gif/villas-boats)
#   VERSION (e.g., v1.0.0, latest)
#
# Production URL: https://villasboats.com

name: villas-boats-production

volumes:
  postgres_data:
    name: villas-boats-postgres-production
  redis_data:
    name: villas-boats-redis-production
  uploads_data:
    name: villas-boats-uploads-production

networks:
  default:
  mcg.sh_network:
    external: true

services:
  postgres:
    image: postgres:18-alpine
    container_name: villas-boats-postgres-production
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: villas-boats-redis-production
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  backend:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_REPO:-elogioseancoras-gif/villas-boats}/backend:${VERSION:-latest}
    container_name: villas-boats-backend-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: https://villasboats.com
      N8N_WEBHOOK_BASE_URL: https://n8n.mcg.sh/webhook
      N8N_WEBHOOK_ENABLED: "true"
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      UPLOAD_DIR: /app/uploads
      VERSION: ${VERSION:-1.0.0}
      # Production-specific settings
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_VILLASBOATS: INFO
    volumes:
      - uploads_data:/app/uploads
    networks:
      - default
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_REPO:-elogioseancoras-gif/villas-boats}/frontend:${VERSION:-latest}
    container_name: villas-boats-frontend-production
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # NEXT_PUBLIC_API_URL is baked into the image at build time via build-arg
      # Production image built with: NEXT_PUBLIC_API_URL=https://api.villasboats.com
      NODE_ENV: production
      # Production-specific Next.js settings
      NEXT_TELEMETRY_DISABLED: 1
    networks:
      - default
      - mcg.sh_network
    labels:
      # Enable Traefik
      - "traefik.enable=true"

      # HTTP Router - Production domain
      - "traefik.http.routers.villasboats-production.rule=Host(`villasboats.com`) || Host(`www.villasboats.com`)"
      - "traefik.http.routers.villasboats-production.entrypoints=websecure"
      - "traefik.http.routers.villasboats-production.tls=true"
      - "traefik.http.routers.villasboats-production.tls.certresolver=letsencrypt"

      # WWW redirect (redirect www to non-www)
      - "traefik.http.middlewares.villasboats-production-redirect.redirectregex.regex=^https://www\\.villasboats\\.com/(.*)"
      - "traefik.http.middlewares.villasboats-production-redirect.redirectregex.replacement=https://villasboats.com/$${1}"
      - "traefik.http.middlewares.villasboats-production-redirect.redirectregex.permanent=true"

      # Service
      - "traefik.http.services.villasboats-production.loadbalancer.server.port=3000"

      # Middleware - Security headers
      - "traefik.http.middlewares.villasboats-production-headers.headers.customResponseHeaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.middlewares.villasboats-production-headers.headers.customResponseHeaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.villasboats-production-headers.headers.customResponseHeaders.Strict-Transport-Security=max-age=31536000; includeSubDomains; preload"
      - "traefik.http.middlewares.villasboats-production-headers.headers.customResponseHeaders.Referrer-Policy=strict-origin-when-cross-origin"
      # Production CSP (stricter than staging)
      # TODO: Implement nonce-based CSP and remove unsafe-inline/unsafe-eval
      - "traefik.http.middlewares.villasboats-production-headers.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.villasboats.com"

      # Rate limiting (production only)
      - "traefik.http.middlewares.villasboats-production-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.villasboats-production-ratelimit.ratelimit.burst=200"

      # Apply all middlewares
      - "traefik.http.routers.villasboats-production.middlewares=villasboats-production-redirect,villasboats-production-headers,villasboats-production-ratelimit"

    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
